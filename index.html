<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LECOI EVENTS · Invitations numériques à Kinshasa</title>
<meta name="description" content="Créez vos invitations numériques, recevez les confirmations et contrôlez les entrées avec des QR codes. Depuis Kinshasa.">
<style>
  :root { --fond:#112250; --fond2:#14213D; --texte:#F5F4F0; --or:#FCA311; --doux:#BEB7A7; --trait:#3B507D; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; }
  body { background: var(--fond); color: var(--texte); font-family: Georgia, "Times New Roman", serif; line-height: 1.6; }
  .conteneur { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .barre { border-bottom: 1px solid var(--trait); }
  .barre .conteneur { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .logo { color: var(--or); letter-spacing: .2em; font-size: .95rem; text-decoration: none; }
  .menu { display: none; }
  .menu a { margin-left: 16px; text-decoration: none; color: var(--doux); font-size: .95rem; }
  @media (min-width: 700px) { .menu { display: block; } }
  .btn { display: inline-block; padding: 13px 22px; border-radius: 4px; text-decoration: none; font-size: 1rem; border: 1px solid var(--or); }
  .btn-plein { background: var(--or); color: var(--fond); }
  .btn-vide { color: var(--or); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
