<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Créer mon invitation – LECOI EVENTS</title>
<style>
  :root { --fond:#F5F4F0; --texte:#112250; --saphir:#3B507D; --champagne:#E7E2CE; --taupe:#BEB7A7; --erreur:#b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--fond); color: var(--texte); font-family: Georgia, serif; line-height: 1.6; padding: 20px; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
  main { max-width: 540px; margin: 0 auto; }
  a.retour { color: var(--saphir); font-size: .95rem; }
  h1 { font-weight: 400; font-size: 2rem; margin: 16px 0 6px; line-height: 1.2; }
  h2 { font-weight: 400; font-size: 1.35rem; margin: 36px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--taupe); }
  p.aide { color: var(--saphir); margin: 0 0 12px; }
  .etoile { color: var(--erreur); }
  label.champ { display: block; margin: 16px 0 6px; font-weight: bold; font-size: .95rem; }
  .indice { display: block; font-weight: normal; color: var(--saphir); font-size: .85rem; }
  input[type=text], input[type=tel], input[type=date], input[type=time], textarea {
    width: 100%; font: inherit; font-size: 1rem; padding: 12px; border-radius: 4px;
    border: 1px solid var(--taupe); background: #fff; color: var(--texte); }
  textarea { min-height: 110px; }
  #invites { min-height: 160px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .invalide { border-color: var(--erreur) !important; box-shadow: 0 0 0 2px rgba(179,38,30,.25); }
  .msg { color: var(--erreur); font-size: .88rem; margin: 4px 0 0; min-height: 1.1em; }

  #apercu { --a-fond:#112250; --a-texte:#F5F4F0; --a-accent:#E7E2CE;
    background: var(--a-fond); color: var(--a-texte); border: 1px solid var(--a-accent);
    border-radius: 6px; text-align: center; padding: 22px 16px; margin: 18px 0 8px;
    outline: 1px solid var(--taupe); outline-offset: 5px; }
  #apercu .type { font-style: italic; opacity: .8; font-size: .9rem; margin: 0 0 6px; }
  #apercu h3 { margin: 0 0 10px; font-weight: 400; font-size: 1.6rem; color: var(--a-accent); line-height: 1.2; }
  #apercu p { margin: 2px 0; font-size: .95rem; }
  #apercu .accent { color: var(--a-accent); }
  .legende { text-align: center; color: var(--saphir); font-size: .85rem; margin: 6px 0 0; }

  .choix { display: grid; gap: 10px; }
  .choix.deux-col { grid-template-columns: 1fr 1fr; }
  .choix label { display: block; cursor: pointer; margin: 0; }
  .choix input { position: absolute; opacity: 0; pointer-events: none; }
  .choix .carte { display: flex; align-items: center; justify-content: center; gap: 12px; text-align: center;
    border: 1px solid var(--taupe); background: #fff; border-radius: 6px; padding: 16px 10px; }
  .choix.liste .carte { justify-content: flex-start; padding: 12px 14px; }
  .choix input:checked + .carte { border-color: var(--texte); box-shadow: 0 0 0 2px var(--texte); background: var(--champagne); }
  .choix input:focus-visible + .carte { outline: 3px solid var(--saphir); outline-offset: 2px; }
  .pastille { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--texte); flex: none; }

  .compte { color: var(--saphir); margin: 6px 0 0; }
  button.envoyer { width: 100%; margin-top: 32px; font: inherit; font-size: 1.1rem; padding: 16px; border: 0; border-radius: 4px; background: var(--texte); color: var(--fond); cursor: pointer; }
  #erreur { color: var(--erreur); margin-top: 14px; min-height: 1.4em; font-weight: bold; }
  .note { color: var(--saphir); font-size: .9rem; text-align: center; margin-top: 12px; }
  :focus-visible { outline: 3px solid var(--saphir); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <a class="retour" href="index.html">← Retour</a>
  <h1>Créer mon invitation</h1>
  <p class="aide">Toutes les informations sont nécessaires (<span class="etoile">*</span>) pour préparer votre invitation. Elle se dessine en direct ci-dessous.</p>

  <div id="apercu" aria-live="polite">
    <p class="type" id="p-type">Mariage</p>
    <h3 id="p-titre">Le titre de votre événement</h3>
    <p id="p-date">Date et heure</p>
    <p id="p-lieu">Lieu</p>
    <p id="p-dress" class="accent"></p>
  </div>
  <p class="legende">Aperçu de votre invitation</p>

  <h2>1. Quel événement ? <span class="etoile">*</span></h2>
  <div class="choix deux-col">
    <label><input type="radio" name="type" value="Mariage" checked><span class="carte">💍 Mariage</span></label>
    <label><input type="radio" name="type" value="Dot"><span class="carte">🌿 Dot</span></label>
    <label><input type="radio" name="type" value="Anniversaire"><span class="carte">🎂 Anniversaire</span></label>
    <label><input type="radio" name="type" value="Fête d’église"><span class="carte">⛪ Fête d’église</span></label>
    <label><input type="radio" name="type" value="Conférence"><span class="carte">🎤 Conférence</span></label>
    <label><input type="radio" name="type" value="Autre"><span class="carte">✨ Autre</span></label>
  </div>

  <h2>2. Les détails</h2>
  <label class="champ" for="titre">Titre ou prénoms <span class="etoile">*</span></label>
  <input id="titre" type="text" placeholder="ex. Esther &amp; Joël" data-nom="le titre">
  <div class="msg" data-pour="titre"></div>

  <div class="deux">
    <div>
      <label class="champ" for="date">Date <span class="etoile">*</span></label>
      <input id="date" type="date" data-nom="la date">
      <div class="msg" data-pour="date"></div>
    </div>
    <div>
      <label class="champ" for="heure">Heure <span class="etoile">*</span></label>
      <input id="heure" type="time" data-nom="l’heure">
      <div class="msg" data-pour="heure"></div>
    </div>
  </div>

  <label class="champ" for="lieu">Nom du lieu <span class="etoile">*</span></label>
  <input id="lieu" type="text" placeholder="ex. Salle Le Prestige" data-nom="le nom du lieu">
  <div class="msg" data-pour="lieu"></div>

  <label class="champ" for="adresse">Adresse (commune, quartier, avenue) <span class="etoile">*</span></label>
  <input id="adresse" type="text" placeholder="ex. Av. de la Libération, Gombe, Kinshasa" data-nom="l’adresse">
  <div class="msg" data-pour="adresse"></div>

  <label class="champ" for="dress">Code vestimentaire <span class="etoile">*</span></label>
  <input id="dress" type="text" placeholder="ex. Tenue de soirée, touche de bleu" data-nom="le code vestimentaire">
  <div class="msg" data-pour="dress"></div>

  <label class="champ" for="programme">Programme de la journée <span class="etoile">*</span>
    <span class="indice">Une étape par ligne, ex. « 14h00 Cérémonie » puis « 17h00 Réception »</span></label>
  <textarea id="programme" placeholder="14h00 Cérémonie&#10;17h00 Réception&#10;20h00 Soirée dansante" data-nom="le programme"></textarea>
  <div class="msg" data-pour="programme"></div>

  <label class="champ" for="rsvp">Répondre avant le <span class="etoile">*</span></label>
  <input id="rsvp" type="date" data-nom="la date limite de réponse">
  <div class="msg" data-pour="rsvp"></div>

  <h2>3. L’ambiance <span class="etoile">*</span></h2>
  <div class="choix liste">
    <label><input type="radio" name="amb" value="Marine et champagne" data-fond="#112250" data-texte="#F5F4F0" data-accent="#E7E2CE" checked><span class="carte"><span class="pastille"
